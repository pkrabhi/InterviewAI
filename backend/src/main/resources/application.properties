# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Database (Supabase PostgreSQL) ───────────────────────────────────────────
# How to get this:
#   1. Go to supabase.com → your project → Settings → Database
#   2. Copy the "Connection string (JDBC)" under "Connection string"
#   3. It looks like: jdbc:postgresql://db.xxxxxxxxxxxx.supabase.co:5432/postgres
#   4. Replace [YOUR-PASSWORD] with your Supabase project password
spring.datasource.url=jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?ssl=true&sslmode=require
spring.datasource.username=postgres
spring.datasource.password=YOUR_SUPABASE_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are already created via SQL Editor in Supabase → ddl-auto=none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Spring Boot's default naming converts camelCase → snake_case automatically
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# ── JWT ───────────────────────────────────────────────────────────────────────
# IMPORTANT: Must be at least 32 characters (256 bits) for HS256 algorithm.
# Generate a strong key: run `openssl rand -base64 64` in terminal
jwt.secret=REPLACE_WITH_A_64_CHAR_RANDOM_STRING_eg_openssl_rand_base64_64_output
jwt.expiration=86400000

# ── Google Sign-In ────────────────────────────────────────────────────────────
# How to get this:
#   1. Go to console.cloud.google.com → APIs & Services → Credentials
#   2. Create an OAuth 2.0 Client ID (Android app type)
#   3. Copy the Client ID here
google.client.id=YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com

# ── Groq API (Primary AI — FREE) ─────────────────────────────────────────────
# Signup: console.groq.com → API Keys → Create Key (instant, no credit card)
groq.api.key=gsk_YOUR_GROQ_API_KEY
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-70b-versatile
groq.max.tokens=500

# ── NVIDIA NIM (Fallback AI — FREE $25 credits) ───────────────────────────────
# Signup: build.nvidia.com → Get API Key
nvidia.api.key=nvapi_YOUR_NVIDIA_API_KEY
nvidia.api.url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.model=meta/llama-3.1-70b-instruct

# ── Razorpay (Phase 9) ────────────────────────────────────────────────────────
razorpay.key.id=YOUR_RAZORPAY_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.interviewai=DEBUG
logging.level.org.springframework.security=INFO
