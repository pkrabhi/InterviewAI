# Used by unit tests — uses H2 in-memory DB so tests run without Supabase
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test_secret_key_minimum_32_chars_long_for_hs256_algorithm_padding
jwt.expiration=86400000
google.client.id=test-client-id
groq.api.key=test-groq-key
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-70b-versatile
groq.max.tokens=500
nvidia.api.key=test-nvidia-key
nvidia.api.url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.model=meta/llama-3.1-70b-instruct
razorpay.key.id=test
razorpay.key.secret=test
